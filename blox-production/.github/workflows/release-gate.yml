# Manual checklist gate before production frontend deploy.
# Automates deploy of Edge Functions when SUPABASE_ACCESS_TOKEN is present;
# migrations are applied via CLI when linked, otherwise OPS must confirm in docs/OPS_CUTOVER.md.

name: Release Gate (Supabase)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Supabase project target label (staging|production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      confirm_migrations_applied:
        description: 'Confirm SQL migrations in supabase/migrations were applied to target'
        required: true
        type: boolean
        default: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require migration confirmation
        if: ${{ inputs.confirm_migrations_applied != true }}
        run: |
          echo "::error::Set confirm_migrations_applied=true after applying supabase/migrations (see docs/OPS_CUTOVER.md)."
          exit 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions (if token present)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          TARGET: ${{ inputs.target }}
        run: |
          set -e
          if [ "$TARGET" = "production" ]; then
            SUPABASE_PROJECT_REF="$PRODUCTION_REF"
          else
            SUPABASE_PROJECT_REF="$STAGING_REF"
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN or project ref missing — deploy functions manually:"
            echo "  supabase functions deploy skipcash-payment --project-ref <ref>"
            echo "  supabase functions deploy skipcash-verify --project-ref <ref>"
            echo "  supabase functions deploy skipcash-webhook --project-ref <ref>"
            exit 0
          fi
          supabase functions deploy skipcash-payment --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy skipcash-verify --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy skipcash-webhook --project-ref "$SUPABASE_PROJECT_REF"

      - name: Print next steps
        run: |
          echo "After this gate succeeds for production:"
          echo "1. Set GitHub secret BACKEND_GATE_CONFIRMED=true"
          echo "2. Run Deploy workflow for production (or push to main)"
          echo "3. Reset BACKEND_GATE_CONFIRMED to false after deploy"
