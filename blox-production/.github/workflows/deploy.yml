# Branch model:
# - staging: push to `develop` OR workflow_dispatch with environment=staging
# - production: push to `main` OR workflow_dispatch with environment=production
# Backend (migrations + edge functions) must pass release-gate before production frontend.

name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_backend_gate:
        description: 'Skip backend gate confirmation (staging only; production requires gate)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  APP_VERSION: ${{ github.sha }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging-admin.blox.com
    env:
      SUPER_ADMIN_PROJECT_ID: ${{ secrets.VERCEL_SUPER_ADMIN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build admin
        run: npm run build:admin
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.STAGING_VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          VITE_BLOX_AI_URL: ${{ secrets.STAGING_VITE_BLOX_AI_URL }}
          VITE_CHATBOT_ENABLED: ${{ secrets.STAGING_VITE_CHATBOT_ENABLED }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Build customer
        run: npm run build:customer
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.STAGING_VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          VITE_BLOX_AI_URL: ${{ secrets.STAGING_VITE_BLOX_AI_URL }}
          VITE_CHATBOT_ENABLED: ${{ secrets.STAGING_VITE_CHATBOT_ENABLED }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Deploy admin to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          vercel-args: '--prod=false'
          working-directory: ./packages/admin

      - name: Deploy customer to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_CUSTOMER_PROJECT_ID }}
          vercel-args: '--prod=false'
          working-directory: ./packages/customer

      - name: Build super-admin (optional)
        if: env.SUPER_ADMIN_PROJECT_ID != ''
        run: npm run build:super-admin
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.STAGING_VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}

      - name: Deploy super-admin to Vercel (optional)
        if: env.SUPER_ADMIN_PROJECT_ID != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_SUPER_ADMIN_PROJECT_ID }}
          vercel-args: '--prod=false'
          working-directory: ./packages/super-admin

      - name: Run smoke tests
        run: |
          set -e
          echo "Smoke tests (staging)"
          sleep 10
          BODY_ADMIN=$(curl -fsS https://staging-admin.blox.com/health)
          BODY_CUSTOMER=$(curl -fsS https://staging-customer.blox.com/health)
          echo "admin/health: $BODY_ADMIN"
          echo "customer/health: $BODY_CUSTOMER"
          echo "$BODY_ADMIN" | grep -q 'ok'
          echo "$BODY_CUSTOMER" | grep -q 'ok'

      - name: Notify on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment successful!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment failed!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    environment:
      name: production
      url: https://admin.blox.com
    env:
      SUPER_ADMIN_PROJECT_ID: ${{ secrets.VERCEL_SUPER_ADMIN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Backend release gate
        env:
          BACKEND_GATE_CONFIRMED: ${{ secrets.BACKEND_GATE_CONFIRMED }}
        run: |
          set -e
          echo "Production requires migrations + edge functions applied first."
          echo "See docs/OPS_CUTOVER.md and .github/workflows/release-gate.yml"
          if [ "${BACKEND_GATE_CONFIRMED}" != "true" ]; then
            echo "::error::Set GitHub secret BACKEND_GATE_CONFIRMED=true only after migrations + skipcash-* functions are deployed to prod Supabase."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build admin
        run: npm run build:admin
        env:
          VITE_SUPABASE_URL: ${{ secrets.PRODUCTION_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.PRODUCTION_VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          VITE_BLOX_AI_URL: ${{ secrets.PRODUCTION_VITE_BLOX_AI_URL }}
          VITE_CHATBOT_ENABLED: ${{ secrets.PRODUCTION_VITE_CHATBOT_ENABLED }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Build customer
        run: npm run build:customer
        env:
          VITE_SUPABASE_URL: ${{ secrets.PRODUCTION_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.PRODUCTION_VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          VITE_BLOX_AI_URL: ${{ secrets.PRODUCTION_VITE_BLOX_AI_URL }}
          VITE_CHATBOT_ENABLED: ${{ secrets.PRODUCTION_VITE_CHATBOT_ENABLED }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Deploy admin to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./packages/admin

      - name: Deploy customer to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_CUSTOMER_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./packages/customer

      - name: Build super-admin (optional)
        if: env.SUPER_ADMIN_PROJECT_ID != ''
        run: npm run build:super-admin
        env:
          VITE_SUPABASE_URL: ${{ secrets.PRODUCTION_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.PRODUCTION_VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}

      - name: Deploy super-admin to Vercel (optional)
        if: env.SUPER_ADMIN_PROJECT_ID != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_SUPER_ADMIN_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./packages/super-admin

      - name: Run smoke tests
        id: smoke
        run: |
          set -e
          echo "Smoke tests (production)"
          sleep 10
          BODY_ADMIN=$(curl -fsS https://admin.blox.com/health)
          BODY_CUSTOMER=$(curl -fsS https://customer.blox.com/health)
          echo "admin/health: $BODY_ADMIN"
          echo "customer/health: $BODY_CUSTOMER"
          echo "$BODY_ADMIN" | grep -q 'ok'
          echo "$BODY_CUSTOMER" | grep -q 'ok'

      - name: Rollback admin on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          set -e
          npx vercel rollback --token "${{ secrets.VERCEL_TOKEN }}" --scope "${{ secrets.VERCEL_ORG_ID }}" --yes || \
            npx vercel ls --token "${{ secrets.VERCEL_TOKEN }}" --scope "${{ secrets.VERCEL_ORG_ID }}"
        working-directory: ./packages/admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}

      - name: Rollback customer on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          set -e
          npx vercel rollback --token "${{ secrets.VERCEL_TOKEN }}" --scope "${{ secrets.VERCEL_ORG_ID }}" --yes || \
            npx vercel ls --token "${{ secrets.VERCEL_TOKEN }}" --scope "${{ secrets.VERCEL_ORG_ID }}"
        working-directory: ./packages/customer
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CUSTOMER_PROJECT_ID }}

      - name: Notify on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment successful'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment failed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
