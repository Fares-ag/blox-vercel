name: Health Check

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch:

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check staging health
        run: |
          set -e
          for url in \
            https://staging-admin.blox.com/health \
            https://staging-customer.blox.com/health
          do
            BODY=$(curl -fsS "$url")
            echo "$url => $BODY"
            echo "$BODY" | grep -q 'ok'
          done

      - name: Check production health
        run: |
          set -e
          for url in \
            https://admin.blox.com/health \
            https://customer.blox.com/health
          do
            BODY=$(curl -fsS "$url")
            echo "$url => $BODY"
            echo "$BODY" | grep -q 'ok'
          done

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Health check failed!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
